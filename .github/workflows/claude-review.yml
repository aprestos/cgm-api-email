name: Claude Review

# Reviews every pull request with this repo's own /review-pr skill and
# reviewer agent (.claude/), and posts the result on the PR: inline comments
# for verified findings, plus one summary comment that is updated on each push.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-pr ${{ github.event.pull_request.number }} --ci
          claude_args: |
            --allowedTools "Skill,Agent,Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(bash .claude/skills/review-pr/existing-comments.sh:*),Bash(bash .claude/skills/review-pr/post-summary.sh:*)"
